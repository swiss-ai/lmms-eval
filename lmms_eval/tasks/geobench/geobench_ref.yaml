dataset_path: json
dataset_kwargs:
  data_files:
    test: zip://Ref-Det/qa.json::hf://datasets/aialliance/GEOBench-VLM/Ref-Det.zip
task: geobench_ref
test_split: test
output_type: generate_until
doc_to_visual: !function utils.geobench_ref_doc_to_visual
doc_to_text: !function utils.geobench_ref_doc_to_text
doc_to_target: !function utils.geobench_ref_doc_to_target
generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.geobench_ref_process_results
metric_list:
  - metric: ref_acc50
    aggregation: !function utils.geobench_ref_aggregate
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    post_prompt: "\nProvide the bounding box as [x1, y1, x2, y2] with coordinates normalized to [0, 1]."
metadata:
  - version: 0.0
