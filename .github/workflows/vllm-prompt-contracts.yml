name: vLLM prompt contracts

on:
  pull_request:
  push:
    branches: [main, 'yxu/sync-upstream-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'accelerate>=1.0,<2' 'numpy>=1.26,<3' 'Pillow>=10,<13' 'loguru==0.7.3' 'transformers==5.15.1' 'pytest>=8,<10'
      - name: Exercise actual wrapper prompt and sampling paths
        run: python -m pytest -q test/models/test_simple_vllm_task_context.py test/models/test_vllm_sampling_params.py
