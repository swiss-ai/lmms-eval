name: rs-task-tests

on:
  push:
    branches: [main, apertus-1p5-eval]
    paths:
      - "lmms_eval/tasks/rsrcc/**"
      - "lmms_eval/tasks/vrsbench/**"
      - "lmms_eval/tasks/geobench/**"
      - "lmms_eval/tasks/bigearth_txt/**"
      - "lmms_eval/tasks/frieda/**"
      - "test/tasks/**"
      - "pyproject.toml"
      - ".github/workflows/rs-task-tests.yml"
  pull_request:
    paths:
      - "lmms_eval/tasks/rsrcc/**"
      - "lmms_eval/tasks/vrsbench/**"
      - "lmms_eval/tasks/geobench/**"
      - "lmms_eval/tasks/bigearth_txt/**"
      - "lmms_eval/tasks/frieda/**"
      - "test/tasks/**"
      - "pyproject.toml"
      - ".github/workflows/rs-task-tests.yml"
  workflow_dispatch:

jobs:
  rs-prompt-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Task utils load by file path, so only their direct imports are needed.
      - name: Install test dependencies
        run: pip install pytest pillow numpy loguru pycocotools pycocoevalcap

      - name: Run prompt-integrity tests
        run: pytest test/tasks/test_rs_prompt_integrity.py -q --noconftest
